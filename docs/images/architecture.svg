<circle cx="70" cy="132" r="13" fill="#0078d4"/><text x="70" y="137" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">5</text>
<text x="92" y="137" font-size="14" font-weight="800" fill="#0078d4">PL_Charge_Master</text><text x="230" y="137" font-size="11" fill="#5b6678">pipeline maître · variables : fileReport (Array), runSummary (String)</text>
