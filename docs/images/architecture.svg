 <text x="730" y="219" font-size="9.5" fill="#107c10" font-weight="700">EXECUTE PIPELINE</text><text x="730" y="238" font-weight="800" font-size="12">EP_IngestFile</text><text x="962" y="238" text-anchor="end" fill="#5b6678" font-size="10">attend la fin</text>
