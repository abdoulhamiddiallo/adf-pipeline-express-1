 <!-- row 2 -->
 <g filter="url(#sh)"><rect x="62" y="350" width="230" height="70" rx="9" fill="#fff" stroke="#00a3b4" stroke-width="2"/><rect x="330" y="350" width="290" height="70" rx="9" fill="#fff" stroke="#8661c5" stroke-width="2"/></g>
 <text x="177" y="371" text-anchor="middle" font-size="9.5" fill="#00a3b4" font-weight="700">DATA FLOW</text><text x="177" y="389" text-anchor="middle" font-weight="800" font-size="12.5">DF_StationDaily</text><text x="177" y="407" text-anchor="middle" fill="#5b6678">exécute DF_Charge_Gold</text>
 <text x="475" y="371" text-anchor="middle" font-size="9.5" fill="#8661c5" font-weight="700">SET VARIABLE</text><text x="475" y="389" text-anchor="middle" font-weight="800" font-size="12.5">SV_Summary</text><text x="475" y="407" text-anchor="middle" fill="#5b6678">le bilan de l'exécution en une phrase</text>
 <path d="M845 336 L845 342 L180 342 L180 346" stroke="#107c10" stroke-width="2.2" fill="none" marker-end="url(#g)"/>
 <path d="M292 385 L326 385" stroke="#107c10" stroke-width="2.2" marker-end="url(#g)"/>
 <rect x="650" y="356" width="336" height="60" rx="8" fill="#0f1b2d"/>
 <text x="662" y="376" fill="#50e6ff" font-size="10" font-family="Consolas, Menlo, monospace">Fichiers : charging_metz.csv = 30 lignes |</text>
 <text x="662" y="391" fill="#e4f1ff" font-size="10" font-family="Consolas, Menlo, monospace">nancy = 30 | thionville = 30 ;</text>
 <text x="662" y="406" fill="#e4f1ff" font-size="10" font-family="Consolas, Menlo, monospace">gold : 6 lignes ; quarantaine : 6 lignes</text>
 <path d="M620 385 L646 385" stroke="#14213d" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#k)"/>
</g>
<!-- TRANSFORM LANE : child + dataflow -->
<rect x="44" y="446" width="410" height="300" rx="10" fill="#e9f7ec" stroke="#107c10" stroke-width="2"/>
<circle cx="70" cy="472" r="13" fill="#107c10"/><text x="70" y="477" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">3</text>
<text x="92" y="477" font-size="14" font-weight="800" fill="#107c10">PL_Charge_IngestFile</text><text x="92" y="494" font-size="11" fill="#5b6678">pipeline enfant · paramètres fileName et runDate</text>
<g font-size="11">
 <g filter="url(#sh)"><rect x="62" y="510" width="374" height="96" rx="9" fill="#fff" stroke="#107c10" stroke-width="2"/><rect x="62" y="634" width="374" height="70" rx="9" fill="#fff" stroke="#8661c5" stroke-width="2"/></g>
 <text x="76" y="530" font-size="9.5" fill="#107c10" font-weight="700">COPY DATA</text><text x="76" y="549" font-weight="800" font-size="12.5">CP_CsvToParquet</text>
 <text x="76" y="568" fill="#14213d">landing/x.csv  →  bronze/ingest_date=…/x.parquet</text>
 <text x="76" y="586" fill="#5b6678">+ colonne source_file (chemin d'origine)</text><text x="76" y="600" fill="#5b6678">+ colonne ingested_at (heure d'ingestion)</text>
 <text x="76" y="654" font-size="9.5" fill="#8661c5" font-weight="700">SET VARIABLE · PIPELINE RETURN VALUE</text><text x="76" y="673" font-weight="800" font-size="12.5">SV_Return</text>
 <text x="76" y="692" fill="#5b6678">renvoie rowsCopied au pipeline maître</text>
 <path d="M249 606 L249 630" stroke="#107c10" stroke-width="2.2" marker-end="url(#g)"/>
 <text x="76" y="728" fill="#107c10" font-size="10.5" font-weight="700">appelé 3 fois en parallèle par EP_IngestFile · 30 lignes par fichier</text>
</g>
<rect x="466" y="446" width="534" height="300" rx="10" fill="#e6f8fa" stroke="#00a3b4" stroke-width="2"/>
<circle cx="492" cy="472" r="13" fill="#00a3b4"/><text x="492" y="477" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">4</text>
<text x="514" y="477" font-size="14" font-weight="800" fill="#00a3b4">DF_Charge_Gold</text><text x="514" y="494" font-size="11" fill="#5b6678">Mapping Data Flow · exécuté sur un cluster Spark géré par Azure</text>
<g font-size="11">
 <g filter="url(#sh)">
