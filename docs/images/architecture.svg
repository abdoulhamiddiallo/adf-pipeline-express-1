<text x="104" y="38" fill="#50e6ff" font-size="15" font-weight="800">TR_OnReady</text>
<text x="104" y="56" fill="#cfe6ff" font-size="11">Storage event trigger · conteneur landing · fichier *_ready.txt · Blob created</text>
<text x="104" y="74" fill="#cfe6ff" font-size="11">CSV d'abord, témoin ensuite : une seule exécution par lot complet.</text>
<rect x="836" y="24" width="150" height="48" rx="8" fill="#0078d4"/><text x="911" y="44" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">ou à la main :</text><text x="911" y="60" text-anchor="middle" fill="#fff" font-size="10.5">Déclencher maintenant</text>
<path d="M500 96 L500 116" stroke="#14213d" stroke-width="2" marker-end="url(#k)"/>
