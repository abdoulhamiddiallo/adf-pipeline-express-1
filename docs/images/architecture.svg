 </g>
 <text x="555" y="532" text-anchor="middle" font-size="9" fill="#00a3b4" font-weight="700">SOURCE</text><text x="555" y="550" text-anchor="middle" font-weight="800" font-size="12">srcBronze</text><text x="555" y="567" text-anchor="middle" fill="#5b6678" font-size="10">schéma à l'exécution</text>
 <text x="729" y="532" text-anchor="middle" font-size="9" fill="#00a3b4" font-weight="700">DERIVED COLUMN</text><text x="729" y="550" text-anchor="middle" font-weight="800" font-size="12">dcTyped</text><text x="729" y="567" text-anchor="middle" fill="#5b6678" font-size="10">texte → nombres, dates</text>
 <text x="908" y="532" text-anchor="middle" font-size="9" fill="#8661c5" font-weight="700">CONDITIONAL SPLIT</text><text x="908" y="550" text-anchor="middle" font-weight="800" font-size="12">splitQuality</text><text x="908" y="567" text-anchor="middle" fill="#5b6678" font-size="10">valide ou rejetée ?</text>
 <text x="729" y="622" text-anchor="middle" font-size="9" fill="#00a3b4" font-weight="700">AGGREGATE</text><text x="729" y="640" text-anchor="middle" font-weight="800" font-size="12">aggDaily</text><text x="729" y="657" text-anchor="middle" fill="#5b6678" font-size="10">station × jour</text>
 <text x="555" y="622" text-anchor="middle" font-size="9" fill="#107c10" font-weight="700">SINK</text><text x="555" y="640" text-anchor="middle" font-weight="800" font-size="12">snkGold</text><text x="555" y="657" text-anchor="middle" fill="#5b6678" font-size="10">station_daily.csv</text>
 <text x="908" y="622" text-anchor="middle" font-size="9" fill="#d83b01" font-weight="700">SINK</text><text x="908" y="640" text-anchor="middle" font-weight="800" font-size="12">snkQuarantine</text><text x="908" y="657" text-anchor="middle" fill="#5b6678" font-size="10">rejected_rows.csv</text>
 <path d="M628 545 L652 545" stroke="#00a3b4" stroke-width="2.2" marker-end="url(#c)"/><text x="640" y="538" text-anchor="middle" fill="#00a3b4" font-size="9.5" font-weight="700">90</text>
 <path d="M802 545 L826 545" stroke="#00a3b4" stroke-width="2.2" marker-end="url(#c)"/><text x="814" y="538" text-anchor="middle" fill="#00a3b4" font-size="9.5" font-weight="700">90</text>
 <path d="M880 576 L880 590 L729 590 L729 600" stroke="#107c10" stroke-width="2.2" fill="none" marker-end="url(#g)"/><text x="760" y="586" fill="#107c10" font-size="9.5" font-weight="800">valid · 84</text>
 <path d="M940 576 L940 600" stroke="#d83b01" stroke-width="2.2" marker-end="url(#o)"/><text x="934" y="596" text-anchor="end" fill="#d83b01" font-size="9.5" font-weight="800">rejet · 6</text>
 <path d="M656 635 L632 635" stroke="#107c10" stroke-width="2.2" marker-end="url(#g)"/><text x="644" y="628" text-anchor="middle" fill="#107c10" font-size="9.5" font-weight="700">6</text>
 <text x="482" y="694" fill="#14213d" font-size="10.5" font-weight="700">Règle de rejet :</text>
 <text x="482" y="710" fill="#5b6678" font-size="10.5">énergie vide ou ≤ 0, prix vide, ou date de session illisible.</text>
 <text x="482" y="728" fill="#5b6678" font-size="10.5">Agrégats : sessions, kwh_total, revenue_eur, avg_duration_min, eur_per_kwh.</text>
</g>
<!-- STORAGE LANE -->
<rect x="44" y="756" width="956" height="254" rx="10" fill="#fffaeb" stroke="#c19c00" stroke-width="2"/>
<circle cx="70" cy="782" r="13" fill="#c19c00"/><text x="70" y="787" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">1</text>
<text x="92" y="787" font-size="14" font-weight="800" fill="#8a6d00">stchargeXXXX</text><text x="214" y="787" font-size="11" fill="#5b6678">Azure Data Lake Storage Gen2 · quatre conteneurs, de la donnée brute à la donnée prête</text>
<g font-size="11">
 <g filter="url(#sh)">
 <rect x="62" y="806" width="214" height="120" rx="9" fill="#fff" stroke="#c19c00" stroke-width="2"/>
 <rect x="300" y="806" width="214" height="120" rx="9" fill="#fff" stroke="#a0522d" stroke-width="2"/>
 <rect x="538" y="806" width="214" height="120" rx="9" fill="#fff" stroke="#107c10" stroke-width="2.5"/>
 <rect x="776" y="806" width="210" height="120" rx="9" fill="#fff" stroke="#d83b01" stroke-width="2"/>
 </g>
 <rect x="62" y="806" width="214" height="24" rx="9" fill="#c19c00"/><text x="169" y="823" text-anchor="middle" fill="#fff" font-weight="800">landing · arrivée</text>
 <rect x="300" y="806" width="214" height="24" rx="9" fill="#a0522d"/><text x="407" y="823" text-anchor="middle" fill="#fff" font-weight="800">bronze · brut fidèle</text>
 <rect x="538" y="806" width="214" height="24" rx="9" fill="#107c10"/><text x="645" y="823" text-anchor="middle" fill="#fff" font-weight="800">gold · prêt à l'analyse</text>
 <rect x="776" y="806" width="210" height="24" rx="9" fill="#d83b01"/><text x="881" y="823" text-anchor="middle" fill="#fff" font-weight="800">quarantine · à corriger</text>
 <text x="74" y="850">3 fichiers CSV</text><text x="74" y="868" fill="#5b6678">+ _ready.txt, le témoin</text><text x="74" y="886" fill="#5b6678">déposés par les stations</text><text x="74" y="910" fill="#8a6d00" font-weight="700">90 lignes de sessions</text>
 <text x="312" y="850">ingest_date=AAAA-MM-JJ/</text><text x="312" y="868" fill="#5b6678">3 fichiers Parquet typés texte</text><text x="312" y="886" fill="#5b6678">+ source_file, ingested_at</text><text x="312" y="910" fill="#a0522d" font-weight="700">90 lignes, rien de perdu</text>
 <text x="550" y="850">station_daily/</text><text x="550" y="868" fill="#5b6678">station_daily.csv</text><text x="550" y="886" fill="#5b6678">une ligne par station et par jour</text><text x="550" y="910" fill="#107c10" font-weight="700">6 lignes, 84 sessions</text>
 <text x="788" y="850">rejected/</text><text x="788" y="868" fill="#5b6678">rejected_rows.csv</text><text x="788" y="886" fill="#5b6678">avec le fichier d'origine</text><text x="788" y="910" fill="#d83b01" font-weight="700">6 lignes défectueuses</text>
 <path d="M276 866 L296 866" stroke="#14213d" stroke-width="2.2" marker-end="url(#k)"/>
 <path d="M514 866 L534 866" stroke="#14213d" stroke-width="2.2" marker-end="url(#k)"/>
 <text x="62" y="950" font-size="10.5" fill="#14213d" font-weight="700">Sécurité :</text><text x="128" y="950" font-size="10.5" fill="#5b6678">la fabrique adf-charge-XXXX lit et écrit grâce à son identité managée et au rôle Storage Blob Data Contributor (étape 1).</text>
 <text x="62" y="970" font-size="10.5" fill="#14213d" font-weight="700">Accès :</text><text x="128" y="970" font-size="10.5" fill="#5b6678">un seul linked service, LS_ADLS_Charge, et deux datasets paramétrés, DS_ADLS_Csv et DS_ADLS_Parquet (étape 2).</text>
 <text x="62" y="990" font-size="10.5" fill="#14213d" font-weight="700">Bilan :</text><text x="128" y="990" font-size="10.5" fill="#5b6678">90 lignes lues = 84 valides agrégées dans gold + 6 isolées dans quarantine. Aucune ligne ne disparaît.</text>
</g>
</g>
